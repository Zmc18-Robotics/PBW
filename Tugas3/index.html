<!DOCTYPE html>
<html lang="id">
<head>
    <title>Tugas Praktikum 4 - Formulir Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Formulir Pendaftaran Mahasiswa Baru</h1>
    </header>
    <div class="container">
        <section class="content">
            <form action="#" method="post" id="formpendaftaran">
                <h2>Data Diri Mahasiswa</h2>
                <p>Silahkan isi formulir di bawah ini untuk melakukan pendaftaran</p>

                <label for="nama"><b>Nama Lengkap:</b></label>
                <input type="text" name="nama" id="nama" required>
                
                <label for="npm"><b>Nomor Pokok Mahasiswa:</b></label>
                <input type="text" name="npm" id="npm" required>

                <label><b>Jenis Kelamin:</b></label>
                <div class="radio-group">
                    <input type="radio" name="jenis_kelamin" id="laki_laki" value="Laki-laki" required>
                    <label for="laki_laki">Laki-laki</label>
                    <input type="radio" name="jenis_kelamin" id="perempuan" value="Perempuan" required>
                    <label for="perempuan">Perempuan</label>
                </div>

                <label><b>Hobi:</b></label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" name="hobi" id="Membaca" value="Membaca">
                        <label for="Membaca">Membaca</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="hobi" id="Olahraga" value="Olahraga">
                        <label for="Olahraga">Olahraga</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="hobi" id="Musik" value="Musik">
                        <label for="Musik">Musik</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="hobi" id="Game" value="Game">
                        <label for="Game">Game</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="hobi" id="Menulis" value="Menulis">
                        <label for="Menulis">Menulis</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="hobi" id="Robotik" value="Robotik">
                        <label for="Robotik">Robotik</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="hobi" id="Anime" value="Anime">
                        <label for="Anime">Anime</label>
                    </div>
                </div>

                <label for="kota"><b>Pilih Kota (Pulau Jawa):</b></label>
                <select name="kota" id="kota" required>
                    <option value="">-- Pilih Kota --</option>
                    <option value="Jakarta">Jakarta</option>
                    <option value="Bandung">Bandung</option>
                    <option value="Surabaya">Surabaya</option>
                    <option value="Yogyakarta">Yogyakarta</option>
                    <option value="Semarang">Semarang</option>
                    <option value="Malang">Malang</option>
                    <option value="Solo">Solo</option>
                    <option value="Bogor">Bogor</option>
                    <option value="Depok">Depok</option>
                    <option value="Bekasi">Bekasi</option>
                    <option value="Tangerang">Tangerang</option>
                    <option value="Cirebon">Cirebon</option>
                    <option value="Kediri">Kediri</option>
                    <option value="Madiun">Madiun</option>
                    <option value="Pasuruan">Pasuruan</option>
                </select>

                <label for="pesan"><b>Pesan Tambahan:</b></label>
                <textarea name="pesan" id="pesan" rows="5" placeholder="Tulis pesan tambahan di sini..."></textarea>

                <button type="button" class="btn" onclick="kirimForm()">Kirim</button>
            </form>
        </section>
    </div>
</body>
</html>
